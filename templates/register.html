{% extends "base.html" %}
{% block title %}Регистрация — Монтаж{% endblock %}
{% block content %}
<section class="auth"><div class="glow g2"></div>
  <form class="glass auth-card auth-wide" method="post">
    <h1 class="h-lg">Регистрация</h1>
    <p class="muted">Поля соответствуют таблице «Пользователь». Пока данные не сохраняются.</p>
    <div class="two">
      <label class="field">ФИО<input name="fio" required></label>
      <label class="field">Телефон<input type="tel" name="phone" required></label>
      <label class="field">Email<input type="email" name="email" required></label>
      <label class="field">Адрес<input name="address"></label>
      <label class="field">Логин<input name="login" autocomplete="username" required></label>
      <label class="field">Пароль<input type="password" name="password" autocomplete="new-password" required></label>
    </div>
    <label class="check"><input type="checkbox" name="is_company" value="1"><span>Я представляю организацию (реквизиты добавим на следующем этапе)</span></label>
    <button class="btn btn-block btn-lg">Создать аккаунт</button>
    <p class="muted center">Уже есть аккаунт? <a class="link" href="{{ url_for('login') }}">Войти</a></p>
  </form>
</section>
{% endblock %}
