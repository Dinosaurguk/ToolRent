
{% extends "base.html" %}

{% block title %}{{ page.title }} — ToolRent{% endblock %}

{% block content %}
<section class="section info-page">
    <div class="wrap">

        <div class="info-page__heading">
            <a class="info-page__back" href="{{ url_for('index') }}">
                <span aria-hidden="true">←</span>
                На главную
            </a>

            <h1 class="h-xl">{{ page.title }}</h1>
            <p class="lead">{{ page.lead }}</p>
        </div>

        <div class="info-page__grid">
            {% for head, body in page.blocks %}
                <article class="glass p-card info-page__card">
                    <h2>{{ head }}</h2>
                    <p class="muted">{{ body }}</p>
                </article>
            {% endfor %}
        </div>

        <div class="info-page__actions">
            <a class="btn btn-ghost" href="{{ url_for('index') }}">
                На главную
            </a>

            <a class="btn" href="{{ url_for('catalog') }}">
                Перейти в каталог
            </a>
        </div>

    </div>
</section>
{% endblock %}
